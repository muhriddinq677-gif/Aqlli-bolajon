    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', sans-serif; }
        body { background: #fcf3cf; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .game-box { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.15); text-align: center; max-width: 600px; width: 100%; border: 4px solid #f1c40f; position: relative; }
        h1.main-title { color: #f39c12; margin-bottom: 15px; font-size: 28px; }
        
        /* Rejimlar tugmalari paneli */
        .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .mode-btn { padding: 12px; font-size: 15px; border: 2px solid #f1c40f; border-radius: 12px; cursor: pointer; background: #fff; font-weight: bold; transition: 0.2s; color: #e67e22; }
        .mode-btn.active { background: #f1c40f; color: #2c3e50; border-color: #f39c12; }
        
        .score-box { font-size: 18px; margin-bottom: 15px; color: #27ae60; font-weight: bold; }
        
        /* SAVOLLARNI JALB ETUVCHI KATTA KO'RINISHI (H1 FORMATIDA) */
        .question-display { background: #fffde7; padding: 25px; border-radius: 16px; margin-bottom: 20px; min-height: 120px; display: flex; justify-content: center; align-items: center; border: 3px dashed #f1c40f; }
        .question-display h1 { font-size: 30px; font-weight: bold; color: #2c3e50; line-height: 1.4; }
        
        /* 4 ta Variant tugmalari */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .opt-btn { background: #f1c40f; color: #2c3e50; border: none; padding: 18px; font-size: 20px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 4px #f39c12; text-align: center; }
        .opt-btn:hover { background: #f39c12; color: white; }
        .opt-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #result { margin-top: 15px; font-size: 22px; font-weight: bold; min-height: 35px; }
        .back-btn { display: inline-block; margin-top: 25px; color: #7f8c8d; text-decoration: none; font-size: 16px; font-weight: bold; }
        
        .top-bar { position: relative; width: 100%; margin-top: 35px; }
        select { position: absolute; top: -45px; right: 0; padding: 6px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    </style>
</head>

    };

    // Rejimni o'zgartirish funksiyasi (Tugmalarni global oynaga chiqarish)
    window.setMode = function(mode) {
        currentMode = mode;
        currentQuestionIndex = 0;
        
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        const targetBtn = document.getElementById(`btn-${mode}`);
        if(targetBtn) targetBtn.classList.add('active');
        
        generateQuestion();
    }

    // Savolni ekranga chiqarish funksiyasi
    function generateQuestion() {
        document.getElementById('result').innerText = '';
        const lang = document.getElementById('lang-select').value;
        
        let activeQuestions = imloQuestions;
        if (currentMode === 'antonim') activeQuestions = antonimQuestions;
        if (currentMode === 'sinonim') activeQuestions = sinonimQuestions;
        if (currentMode === 'gap') activeQuestions = gapQuestions;

        if (currentQuestionIndex >= activeQuestions.length) {
            currentQuestionIndex = 0;
        }

        currentQuestionData = activeQuestions[currentQuestionIndex];

        document.getElementById("question-text").innerText = currentQuestionData.qText[lang] || currentQuestionData.qText['uz'];

        for (let i = 0; i < 4; i++) {
            document.getElementById(`opt${i}`).innerText = currentQuestionData.options[i];
        }
    }

    // Javobni tekshirish funksiyasi (Global oynaga chiqarish)
    window.checkAnswer = function(selectedIndex) {
        const resultDiv = document.getElementById('result');
        const lang = document.getElementById('lang-select').value;

        if (selectedIndex === currentQuestionData.answer) {
            score += 10;
            document.getElementById('score').innerText = score;
            resultDiv.innerText = langData[lang].right;
            resultDiv.style.color = "#2ecc71";
            currentQuestionIndex++;
            setTimeout(generateQuestion, 1500);
        } else {
            resultDiv.innerText = langData[lang].wrong;
            resultDiv.style.color = "#e74c3c";
        }
    }

    // Tilni almashtirish funksiyasi (Global oynaga chiqarish)
    window.changeLanguage = function() {
        const lang = document.getElementById('lang-select').value;
        document.querySelectorAll('[data-lang]').forEach(el => {
            const key = el.getAttribute('data-lang');
            if(langData[lang][key]) {
                el.innerText = langData[lang][key];
            }
        });
        generateQuestion();
    }
    // === REYTING UCHUN BALLARNI BOSH SAHIFAGA YUBORISH KODI ===
    window.saveScoreAndGoBack = function() {
        localStorage.setItem('current_game_score', score); // Joriy ballni xotiraga saqlaydi
    }

    // O'yinni ilk bor yuklash
    generateQuestion();
