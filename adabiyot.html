        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', sans-serif; }

        .game-box { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.15); text-align: center; max-width: 650px; width: 100%; border: 4px solid #9b59b6; position: relative; }
        h1.main-title { color: #8e44ad; margin-bottom: 15px; font-size: 28px; }
        
        .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .mode-btn { padding: 12px; font-size: 16px; border: 2px solid #9b59b6; border-radius: 12px; cursor: pointer; background: #fff; font-weight: bold; transition: 0.2s; color: #8e44ad; }
        .mode-btn.active { background: #9b59b6; color: white; border-color: #8e44ad; }
        
        .score-box { font-size: 18px; margin-bottom: 15px; color: #27ae60; font-weight: bold; display: flex; justify-content: space-between; background: #f5eeeb; padding: 10px 15px; border-radius: 10px; }
        .timer-badge { color: #e74c3c; font-weight: bold; }

        /* Matn va Savol Ko'rinishi */
        .display-area { background: #faf9f6; padding: 25px; border-radius: 16px; margin-bottom: 20px; border: 3px dashed #9b59b6; text-align: left; }
        .display-area h1 { font-size: 26px; font-weight: bold; color: #2c3e50; line-height: 1.4; margin-bottom: 15px; text-align: center; }
        
        /* Tez o'qish uchun maxsus uzun matn oynasi */
        .story-scroll-box { max-height: 350px; overflow-y: scroll; padding-right: 10px; margin-top: 15px; font-size: 18px; line-height: 1.8; color: #34495e; text-align: justify; border-top: 1px solid #ddd; padding-top: 10px; }
        
        /* Taymer Tanlash Paneli */
        .timer-selector { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
        .time-btn { background: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px #2980b9; }
        .time-btn:active { transform: translateY(4px); box-shadow: none; }

        /* 4 ta Variant tugmalari */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .opt-btn { background: #9b59b6; color: white; border: none; padding: 18px; font-size: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 4px #8e44ad; text-align: center; }
        .opt-btn:hover { background: #8e44ad; }
        .opt-btn:active { transform: translateY(4px); box-shadow: none; }
        
        /* Amaliyot tugmasi */
        .action-btn { display: block; background: #2ecc71; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 5px #27ae60; text-align: center; }
        
        #result { margin-top: 15px; font-size: 22px; font-weight: bold; min-height: 35px; }
        .back-btn { display: inline-block; margin-top: 25px; color: #7f8c8d; text-decoration: none; font-size: 16px; font-weight: bold; }
        
        .top-bar { position: relative; width: 100%; margin-top: 35px; }
        select { position: absolute; top: -45px; right: 0; padding: 6px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    </style>

    // === 3-QISM: TEZ O'QISH UCHUN 300 TA SO'ZLIK UZUN HIKOYALAR BAZASI ===
    const readingStories = {
        uz: `Qadimiy bir shaharchada Alisher ismli juda qiziquvchan bola yashar edi. U har kuni maktabdan qaytgach, bobosining eski va qiziqarli kitoblar bilan to'la kutubxonasiga shoshilardi. Bobosi har doim unga: "O'g'lim, dunyodagi eng katta boylik — bu oltin yoki pul emas, balki kitoblardan olinadigan toza bilimdir", deb takrorlar edi. Alisher bobosining bu gaplarini yurakdan his qilar, har bir sahifani ochganda yangi bir dunyoga kirib qolgandek bo'lardi.
        
        Kunlardan bir kuni u kutubxonaning eng chekka burchagidan ustini chang qoplagan, qalin va moviy rangli muqovali sirli kitobni topib oldi. Bu kitob oddiy kitoblarga o'xshamasdi. Uning muqovasida yulduzlar va sehrli naqshlar tasvirlangan edi. Alisher kitobni ehtiyotkorlik bilan ochdi va hayratdan qotib qoldi. Birinchi sahifada uning o'z ismi va bugungi sana yozilgan edi! Kitob xuddi tirikdek, Alisher bilan muloqot qila boshladi.
        
        "Xush kelibsiz, yosh qidiruvchi!" — deb yozilgandi keyingi qatorda. "Agar sen ushbu matnlarni diqqat bilan va tez o'qiy olsang, bilimlar dunyosining haqiqiy sehrgari bo'la olasan. Sening kelajaging va muvaffaqiyating hozir qanchalik ko'p va tez ma'lumot o'rganishingga bog'liq." Alisher quvonib ketdi va taymerni yoqib, katta ishtiyoq bilan o'qishni boshladi.
        
        U sehrli mamlakatlar, qadimiy kompyuterlar, yulduzlararo sayohatlar va matematika olamining mo'jizalari haqida o'qiy boshladi. Har bir dars va hikoya uning tasavvurini kengaytirardi. Bola matnni o'qigan sari, uning miyasi tezroq va aniqroq fikrlay boshlaganini sezdi. U endi oddiy narsalarga ham boshqacha, dono nigoh bilan qarardi. 
        
        Bobosi uning o'qishini ko'rib, jilmydi va: "Dasturchilar, muhandislar va buyuk olimlar hammasi mana shunday tez va ko'p o'qish orqali muvaffaqiyatga erishganlar", dedi. Alisher o'z oldiga katta maqsad qo'ydi: u dunyodagi eng aqlli va foydali inson bo'lib yetishadi. Buning uchun esa har kuni kitob o'qishdan to'xtamaslik kerakligini tushunib yetdi. Sehrli kitob uning eng sodiq do'stiga aylandi.`,

        en: `In a ancient little town, there lived a very curious boy named Alisher. Every day after returning from school, he would rush to his grandfather's library, which was filled with old and fascinating books. His grandfather always repeated to him: "My son, the greatest wealth in the world is not gold or money, but the pure knowledge obtained from books." Alisher felt these words from the bottom of his heart, and every time he opened a page, he felt as if he was entering a whole new world.
        
        One day, he found a mysterious book with a dusty, thick, and blue cover in the furthest corner of the library. This book was not like ordinary ones. Its cover was decorated with stars and magical patterns. Alisher carefully opened the book and froze in astonishment. On the first page, his own name and today's date were written! The book began to communicate with Alisher as if it were alive.
        
        "Welcome, young seeker!" — was written on the next line. "If you can read these texts carefully and quickly, you can become a real wizard of the world of knowledge. Your future and success depend on how much and how fast you learn information right now." Alisher was overjoyed, turned on the timer, and began reading with great enthusiasm.
        
        He began to read about magical lands, ancient computers, interstellar travel, and the wonders of the world of mathematics. Each story and lesson expanded his imagination. As the boy read the text, he noticed that his brain began to think faster and more accurately. He now looked at ordinary things with a different, wiser eye.
        
        His grandfather smiled, watching him read, and said: "Programmers, engineers, and great scientists all achieved success through reading fast and much like this." Alisher set a big goal for himself: he would become the smartest and most useful person in the world. And for this, he realized that he should never stop reading books every day. The magic book became his most loyal friend.`,

        ru: `В одном старинном городке жил очень любознательный мальчик по имени Алишер. Каждый день после возвращения из школы он спешил в библиотеку своего дедушки, которая была заполнена старыми и интересными книгами. Дедушка всегда повторял ему: "Сын мой, величайшее богатство в мире — это не золото или деньги, а чистые знания, полученные из книг". Алишер чувствовал эти слова всем сердцем, и каждый раз, открывая страницу, ему казалось, что он попадает в совершенно новый мир.
        
        Однажды в самом дальнем углу библиотеки он нашел таинственную книгу с покрытой пылью, толстой и синей обложкой. Эта книга не была похожа на обычные. Ее обложка была украшена звездами и волшебными узорами. Алишер осторожно открыл книгу и замер от изумления. На первой странице были написаны его собственное имя и сегодняшняя дата! Книга начала общаться с Алишером, как будто она была живой.
        
        "Добро пожаловать, юный искатель!" — было написано на следующей строке. "Если ты сможешь читать эти тексты внимательно и быстро, ты сможешь стать настоящим волшебником мира знаний. Твое будущее и успех зависят от того, как много и как быстро ты изучаешь информацию прямо сейчас". Алишер обрадовался, включил таймер и начал читать с большим энтузиазмом.
        
        Он начал читать о волшебных странах, древних компьютерах, межзвездных путешествиях и чудесах мира математики. Каждая история и урок расширяли его воображение. По мере того как мальчик читал текст, он замечал, что его мозг начинает думать быстрее и точнее. Теперь он смотрел на обычные вещи другим, более мудрым взглядом.

    };

    }
    // === 5-QISM: O'YIN MANTIQLARI, TAYMERLAR VA YAKUNIY QAVS ===

    function generateQuestion() {
        document.getElementById('result').innerText = '';
        const lang = document.getElementById('lang-select').value;
        const mainDisplay = document.getElementById("main-display");
        const optionsBox = document.getElementById("options-box");

        if (currentMode === 'maqol') {
            optionsBox.style.display = "grid";
            
            if (currentQuestionIndex >= fullMaqolDatabase.length) {
                currentQuestionIndex = 0;
            }

            currentQuestionData = fullMaqolDatabase[currentQuestionIndex];
            mainDisplay.innerHTML = `<h1>${currentQuestionData.qText[lang] || currentQuestionData.qText['uz']}</h1>`;

            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt${i}`).innerText = currentQuestionData.options[i];
            }
        } else {
            // Tez o'qish rejimi (Taymer tanlash paneli)
            optionsBox.style.display = "none";
            
            // Ingliz, rus va o'zbek tillaridan boshqa tillar uchun o'zbekcha matn tanlanadi
            let storyText = readingStories[lang] || readingStories['uz'];
            
            mainDisplay.innerHTML = `
                <p style="font-weight: bold; color: #8e44ad; font-size: 18px; text-align: center; margin-bottom: 10px;">${langData[lang]["select-time"]}</p>
                <div class="timer-selector">
                    <button class="time-btn" onclick="startReadingGame(60)">1 ${langData[lang]["time-min"]}</button>
                    <button class="time-btn" onclick="startReadingGame(120)">2 ${langData[lang]["time-min"]}</button>
                    <button class="time-btn" onclick="startReadingGame(180)">3 ${langData[lang]["time-min"]}</button>
                </div>
                <div class="story-scroll-box" id="story-text-container" style="display: none;">
                    ${storyText}
                </div>
            `;
        }
    }

    // Tez o'qish taymerini ishga tushirish
    window.startReadingGame = function(seconds) {
        selectedTimeLimit = seconds;
        document.getElementById("story-text-container").style.display = "block";
        document.getElementById("timer-container").style.display = "block";
        document.getElementById("finish-reading-btn").style.display = "block";
        document.getElementById('result').innerText = '';

        let timeLeft = selectedTimeLimit;
        updateTimerDisplay(timeLeft);

        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay(timeLeft);

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                stopReadingTimer();
            }
        }, 1000);
    }

    function updateTimerDisplay(seconds) {
        let mins = Math.floor(seconds / 60);
        let secs = seconds % 60;
        document.getElementById("timer-countdown").innerText = 
            `${mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;
    }

    // O'qib bo'linganda ball berish
    window.stopReadingTimer = function() {
        clearInterval(countdownInterval);
        const lang = document.getElementById('lang-select').value;
        const resultDiv = document.getElementById('result');

        score += 20; // Tez o'qish muvaffaqiyatli yakunlangani uchun ko'proq ball
        document.getElementById('score').innerText = score;
        
        resultDiv.innerText = langData[lang]["score-msg"];
        resultDiv.style.color = "#2ecc71";

        document.getElementById("finish-reading-btn").style.display = "none";
        document.getElementById("timer-container").style.display = "none";
    }

    // Maqol javobini tekshirish
    window.checkAnswer = function(selectedIndex) {
        const resultDiv = document.getElementById('result');
        const lang = document.getElementById('lang-select').value;

        if (selectedIndex === currentQuestionData.answer) {
            score += 10;
            document.getElementById('score').innerText = score;
            resultDiv.innerText = langData[lang].right;
            resultDiv.style.color = "#2ecc71";
            currentQuestionIndex++;
            setTimeout(generateQuestion, 1500);
        } else {
            resultDiv.innerText = langData[lang].wrong;
            resultDiv.style.color = "#e74c3c";
        }
    }

    // Tilni o'zgartirish
    window.changeLanguage = function() {
        const lang = document.getElementById('lang-select').value;
        document.querySelectorAll('[data-lang]').forEach(el => {
            const key = el.getAttribute('data-lang');
            if(langData[lang][key]) {
                el.innerText = langData[lang][key];
            }
        });
        generateQuestion();
    }

    // Ilk bor ishga tushirish
    generateQuestion();
        // === REYTING UCHUN BALLARNI BOSH SAHIFAGA YUBORISH KODI ===
    window.saveScoreAndGoBack = function() {
        localStorage.setItem('current_game_score', score); // Joriy ballni xotiraga saqlaydi
    }


} // <--- 5-bo'lakning va butun reading_game.js faylining ENG OXIRGI yopuvchi qavsi!
