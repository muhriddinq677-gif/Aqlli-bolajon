        /* Savol ko'rsatish maydoni */

        .opt-btn { background: #3498db; color: white; border: none; padding: 18px; font-size: 19px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 4px #2980b9; text-align: center; }

        .opt-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #result { margin-top: 15px; font-size: 22px; font-weight: bold; min-height: 35px; text-align: center; }
        .back-btn { display: inline-block; margin-top: 25px; color: #7f8c8d; text-decoration: none; font-size: 16px; font-weight: bold; }

    window.setMode = function(mode) {
        currentMode = mode;
        currentQuestionIndex = 0;
        document.getElementById('result').innerText = '';
        
        // Rasmdagi dizayn kabi tanlangan tugmani faollashtirish (ko'k rangga o'tkazish)
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        const targetBtn = document.getElementById(`mode-${mode}`);
        if (targetBtn) targetBtn.classList.add('active');
        
        generateQuestion();
    }
    // === 10-QISM: JAVOBLARNI TEKSHIRISH, SAVOLLARNI CHIZISH VA YAKUNIY QAVS ===

    function generateQuestion() {
        document.getElementById('result').innerText = '';
        const lang = document.getElementById('lang-select').value;

        // Amaldagi rejimga qarab tegishli ma'lumotlar bazasini tanlash
        let activeQuestions = fullKimyoFizikaDatabase;
        if (currentMode === 'biologiya') activeQuestions = fullBiologiyaDatabase;
        if (currentMode === 'geografiya') activeQuestions = fullGeografiyaDatabase;
        if (currentMode === 'formula') activeQuestions = formulaQuestions;

        // Agar savollar ro'yxati tugasa, yana boshidan boshlaydi
        if (currentQuestionIndex >= activeQuestions.length) {
            currentQuestionIndex = 0;
        }

        currentQuestionData = activeQuestions[currentQuestionIndex];
        
        // Savol raqamini va sarlavhasini yangilash
        document.getElementById("current-question-num").innerText = currentQuestionIndex + 1;
        document.getElementById("text-question").innerText = langData[lang]["text-question"];

        // Savol matnini katta h1 ichiga chiqarish
        document.getElementById("question-text").innerText = currentQuestionData.qText[lang] || currentQuestionData.qText['uz'];

        // 4 ta variant tugmalariga matnlarni joylash
        for (let i = 0; i < 4; i++) {
            let opt = currentQuestionData.options;
            let optionText = "";
            
            if (Array.isArray(opt)) {
                optionText = opt[i];
            } else {
                optionText = opt[lang] ? opt[lang][i] : opt['uz'][i];
            }
            
            document.getElementById(`opt${i}`).innerText = optionText;
        }
    }

    // Javobni tekshirish funksiyasi (Global oynaga chiqarish)
    window.checkAnswer = function(selectedIndex) {
        const resultDiv = document.getElementById('result');
        const lang = document.getElementById('lang-select').value;

        if (selectedIndex === currentQuestionData.answer) {
            score += 10;
            document.getElementById('score').innerText = score;
            resultDiv.innerText = langData[lang].right;
            resultDiv.style.color = "#2ecc71";
            currentQuestionIndex++;
            setTimeout(generateQuestion, 1500);
        } else {
            resultDiv.innerText = langData[lang].wrong;
            resultDiv.style.color = "#e74c3c";
        }
    }

    // Ballarni bosh sahifadagi TOP-50 jonli reytingga yuborish mantiqi
    window.saveScoreAndGoBack = function() {
        localStorage.setItem('current_game_score', score);
    }

    // Tilni almashtirish funksiyasi (Global oynaga chiqarish)
    window.changeLanguage = function() {
        const lang = document.getElementById('lang-select').value;
        document.querySelectorAll('[data-lang]').forEach(el => {
            const key = el.getAttribute('data-lang');
            if(langData[lang][key]) {
                el.innerText = langData[lang][key];
            }
        });
        generateQuestion();
    }

    // O'yinni ilk bor yuklash
    generateQuestion();
