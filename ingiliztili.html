        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', sans-serif; }
        body { background: #fef5e7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .game-box { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.15); text-align: center; max-width: 550px; width: 100%; border: 4px solid #e67e22; position: relative; }
        h1 { color: #d35400; margin-bottom: 10px; font-size: 26px; }
        
        /* O'yin rejimlari paneli */
        .game-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .mode-btn { padding: 12px; font-size: 15px; border: 2px solid #f39c12; border-radius: 12px; cursor: pointer; background: #fff; font-weight: bold; transition: 0.2s; color: #d35400; }
        .mode-btn.active { background: #e67e22; color: white; border-color: #d35400; }
        
        .score-box { font-size: 18px; margin-bottom: 15px; color: #27ae60; font-weight: bold; }
        .emoji-display { font-size: 80px; background: #fffde7; padding: 15px; border-radius: 16px; margin-bottom: 15px; min-height: 120px; display: flex; justify-content: center; align-items: center; border: 3px dashed #f39c12; }
        
        /* So'z va Harflar ko'rinishi */
        .word-display { font-size: 36px; font-weight: bold; color: #2c3e50; margin-bottom: 25px; letter-spacing: 4px; }
        
        /* 1-rejim: Variantlar uchun konteyner */
        .options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .opt-btn { background: #f1c40f; color: #2c3e50; border: none; padding: 15px; font-size: 22px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 4px #f39c12; }
        .opt-btn:active { transform: translateY(4px); box-shadow: none; }
        
        /* 2-rejim: Harf terish maydoni */
        .scramble-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .letter-btn { background: #3498db; color: white; border: none; width: 50px; height: 50px; font-size: 22px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 4px #2980b9; }
        .letter-btn:active { transform: translateY(4px); box-shadow: none; }
        .letter-btn.used { background: #bdc3c7; box-shadow: none; cursor: not-allowed; transform: none; opacity: 0.6; }
        
        /* O'chirish va tozalash tugmalari */
        .control-btns { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .ctrl-btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        #result { margin-top: 15px; font-size: 22px; font-weight: bold; min-height: 35px; }
        .back-btn { display: inline-block; margin-top: 25px; color: #7f8c8d; text-decoration: none; font-size: 15px; font-weight: bold; }
        
        /* Til tanlash */
        .top-bar { position: relative; width: 100%; margin-top: 35px; }
        select { position: absolute; top: -45px; right: 0; padding: 6px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    </style>

function switchMode(mode) {
    currentMode = mode;
    currentQuestionIndex = 0;
    
    document.getElementById("mode1-btn").classList.remove("active");
    document.getElementById("mode2-btn").classList.remove("active");
    document.getElementById("mode3-btn").classList.remove("active");
    
    document.getElementById("options-box").style.display = "none";
    document.getElementById("scramble-box").style.display = "none";
    document.getElementById("match-box").style.display = "none";
    
    if (mode === 1) {
        document.getElementById("mode1-btn").classList.add("active");
        document.getElementById("options-box").style.display = "grid";
    } else if (mode === 2) {
        document.getElementById("mode2-btn").classList.add("active");
        document.getElementById("scramble-box").style.display = "block";
    } else if (mode === 3) {
        document.getElementById("mode3-btn").classList.add("active");
        document.getElementById("match-box").style.display = "block";
    }
    generateQuestion();
}

function generateQuestion() {
    document.getElementById('result').innerText = '';
    
    if (currentMode === 1) {
        if (currentQuestionIndex >= mode1Questions.length) currentQuestionIndex = 0;
        currentQuestion = mode1Questions[currentQuestionIndex];
        
        document.getElementById("emoji-area").innerText = currentQuestion.emoji;
        document.getElementById("word-area").innerText = currentQuestion.display;
        
        // Variantlarni joylash
        const optionsBox = document.getElementById("options-box");
        optionsBox.innerHTML = "";
        currentQuestion.options.forEach(letter => {
            optionsBox.innerHTML += `<button class="opt-btn" onclick="checkMode1('${letter}')">${letter}</button>`;
        });

// 1-Rejim: Harfni tekshirish
function checkMode1(selectedLetter) {
    const resultDiv = document.getElementById('result');
    const currentLang = document.getElementById('lang-select').value;
    const correctLetter = currentQuestion.word[currentQuestion.missingIdx];

    if (selectedLetter === correctLetter) {
        score += 10;
        document.getElementById('score').innerText = score;
        document.getElementById("word-area").innerText = currentQuestion.word;
        resultDiv.innerText = langData[currentLang].right;
        resultDiv.style.color = "#2ecc71";
        currentQuestionIndex++;
        setTimeout(generateQuestion, 1500);
    } else {
        resultDiv.innerText = langData[currentLang].wrong;
        resultDiv.style.color = "#e74c3c";
    }
}

// 2-Rejim: Harf tanlash bosilganda
function selectScrambleLetter(letter, idx) {
    const btn = document.getElementById(`scrm-${idx}`);
    if (btn.classList.contains("used")) return;
    
    btn.classList.add("used");
    builtWord += letter;
    document.getElementById("word-area").innerText = builtWord;
    
    // Agar hamma harf terilgan bo'lsa tekshirish
    if (builtWord.length === currentQuestion.word.length) {
        checkMode2();
    }
}

// 2-Rejim: Tozalash tugmasi bosilganda
function resetScrambleWord() {
    builtWord = "";
    document.getElementById("word-area").innerText = "_ ".repeat(currentQuestion.word.length);
    document.querySelectorAll(".letter-btn").forEach(btn => btn.classList.remove("used"));
    document.getElementById('result').innerText = '';
}

// 2-Rejim: So'zni tekshirish
function checkMode2() {
    const resultDiv = document.getElementById('result');
    const currentLang = document.getElementById('lang-select').value;

    if (builtWord === currentQuestion.word) {
        score += 15; // So'z yasash qiyinroq bo'lgani uchun ko'proq ball
        document.getElementById('score').innerText = score;
        resultDiv.innerText = langData[currentLang].right;
        resultDiv.style.color = "#2ecc71";
        currentQuestionIndex++;
        setTimeout(generateQuestion, 1500);
    } else {
        resultDiv.innerText = langData[currentLang].wrong;
        resultDiv.style.color = "#e74c3c";
        setTimeout(resetScrambleWord, 1000); // Xato bo'lsa 1 sekunddan keyin harflarni qaytaradi
    }
}

function changeLanguage() {
    const lang = document.getElementById('lang-select').value;
    document.querySelectorAll('[data-lang]').forEach(el => {
        const key = el.getAttribute('data-lang');
        el.innerText = langData[lang][key];
    });
}
