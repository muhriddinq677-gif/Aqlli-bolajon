<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang="title">🌍 Atrofimizdagi Olam</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', sans-serif; }
        body { background: #eafaf1; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .game-box { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.15); text-align: center; max-width: 600px; width: 100%; border: 4px solid #2ecc71; position: relative; }
        h1.main-title { color: #27ae60; margin-bottom: 20px; font-size: 28px; }
        
        .score-box { font-size: 18px; margin-bottom: 15px; color: #2ecc71; font-weight: bold; display: flex; justify-content: space-between; background: #e8f8f5; padding: 12px 15px; border-radius: 10px; }
        
        /* КРУПНЫЙ ШRIFT ДЛЯ ЗАГАДОК И ЭМОДЗИ (H1 FORMAT) */
        .question-display { background: #f4fbf7; padding: 25px; border-radius: 16px; margin-bottom: 20px; min-height: 130px; display: flex; justify-content: center; align-items: center; border: 3px dashed #2ecc71; }
        .question-display h1 { font-size: 28px; font-weight: bold; color: #2c3e50; line-height: 1.4; }
        
        /* 4 кнопки вариантов ответов */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .opt-btn { background: #2ecc71; color: white; border: none; padding: 18px; font-size: 19px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 4px #27ae60; text-align: center; }
        .opt-btn:hover { background: #27ae60; }
        .opt-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #result { margin-top: 15px; font-size: 22px; font-weight: bold; min-height: 35px; text-align: center; }
        .back-btn { display: inline-block; margin-top: 25px; color: #7f8c8d; text-decoration: none; font-size: 16px; font-weight: bold; }
        
        .top-bar { position: relative; width: 100%; margin-top: 35px; }
        select { position: absolute; top: -45px; right: 0; padding: 6px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; border: 2px solid #2ecc71; }
    </style>
</head>
<body>

    <div class="game-box">
        <div class="top-bar">
            <select id="lang-select" onchange="changeLanguage()">
                <option value="uz">🇺🇿 UZ</option>
                <option value="en">🇬🇧 EN</option>
                <option value="ru">🇷🇺 RU</option>
                <option value="tr">🇹🇷 TR</option>
                <option value="ko">🇰🇷 KO</option>
            </select>
        </div>

        <h1 class="main-title" data-lang="title">🌍 Atrofimizdagi Olam</h1>
        
        <div class="score-box">
            <div><span data-lang="text-question">Savol</span>: <span id="current-question-num">1</span>/10</div>
            <div><span data-lang="score">Ball</span>: <span id="score">0</span></div>
        </div>
        
        <!-- Окно для отображения крупных интерактивных загадок -->
        <div class="question-display">
            <h1 id="question-text">...</h1>
        </div>
        
        <!-- 4 кнопки ответов как вы просили -->
        <div class="options-grid">
            <button class="opt-btn" onclick="checkAnswer(0)" id="opt0">...</button>
            <button class="opt-btn" onclick="checkAnswer(1)" id="opt1">...</button>
            <button class="opt-btn" onclick="checkAnswer(2)" id="opt2">...</button>
            <button class="opt-btn" onclick="checkAnswer(3)" id="opt3">...</button>
        </div>
        
        <div id="result"></div>
        
        <!-- Кнопка возврата с сохранением очков для рейтинга -->
        <a href="index.html" onclick="saveScoreAndGoBack()" class="back-btn">
            <i class="fas fa-arrow-left"></i> <span data-lang="btn-back">Orqaga qaytish</span>
        </a>
    </div>

    <script>
        { // Fayl boshlanishi (Boshqa o'yinlar bilan to'qnashuvni oldini olish qobig'i)

    // === GLOBAL O'ZGARUVCHILAR VA HOLATLAR ===

    let currentQuestionIndex = 0;
    let currentQuestionData = null;

    // === ATROFIMIZDAGI OLAM JUMBOQLARI (1-2 SAVOLLAR) ===

                en: ["Lion (King of forest)", "Bear", "Wolf", "Fox"],
                ru: ["Лев (Король леса)", "Медведь", "Волк", "Лиса"],
                tr: ["Aslan (Orman kralı)", "Ayı", "Kurt", "Tilki"],

                tr: "⛅ Mevsimler bulmacası: ⛄ + ❄️ + 🌲 = ?",
                ko: "⛅ 계절 퍼즐: ⛄ + ❄️ + 🌲 = ?"
            },
            options: {

                en: ["Winter", "Spring", "Summer", "Autumn"],
                ru: ["Зима", "Весна", "Лето", "Осень"],
                tr: ["Kış", "İlkbahar", "Yaz", "Sonbahar"],
                ko: ["겨울", "봄", "여름", "가을"]
            },
            answer: 0
        }
    ];
    // === ATROFIMIZDAGI OLAM JUMBOQLARI (3-4 SAVOLLAR) ===
    const olamQuestions2 = [
        {
            qText: {
                uz: "🚀 Koinot jumbog'i: 🌍 ➔ 🌙 (Yer atrofida nima aylanadi?)",
                en: "🚀 Space puzzle: 🌍 ➔ 🌙 (What orbits the Earth?)",

                ko: "🚀 우주 퍼즐: 🌍 ➔ 🌙 (지구 주위를 돌고 있는 것은?)"
            },
            options: {

                en: ["Sun ☀️", "Moon 🌙", "Star ⭐", "Mars 🔴"],
                ru: ["Солнце ☀️", "Луна 🌙", "Звезда ⭐", "Марс 🔴"],
                tr: ["Güneş ☀️", "Ay 🌙", "Yıldız ⭐", "Mars 🔴"],
                ko: ["태양 ☀️", "달 🌙", "별 ⭐", "화성 🔴"]
            },
            answer: 1
        },
        {
            qText: {
                uz: "🌱 Tabiat sehrgari: Urug' ➔ Suv ➔ Quyosh ➔ ?",
                en: "🌱 Nature wizard: Seed ➔ Water ➔ Sun ➔ ?",
                ru: "🌱 Волшебник природы: Семя ➔ Вода ➔ Солнце ➔ ?",
                tr: "🌱 Doğa sihirbazı: Tohum ➔ Su ➔ Güneş ➔ ?",
                ko: "🌱 자연 마법사: 씨앗 ➔ 물 ➔ 태양 ➔ ?"
            },
            options: {
                uz: ["Tosh 🪨", "Koptok ⚽", "Chiroyli Gul 🌹", "Kitob 📘"],
                en: ["Stone 🪨", "Ball ⚽", "Beautiful Flower 🌹", "Book 📘"],
                ru: ["Камень 🪨", "Мяч ⚽", "Красивый цветок 🌹", "Книга 📘"],
                tr: ["Taş 🪨", "Top ⚽", "Güzel Çiçek 🌹", "Kitap 📘"],
                ko: ["돌 🪨", "공 ⚽", "예쁜 꽃 🌹", "책 📘"]
            },
            answer: 2
        }
    ];
    // === ATROFIMIZDAGI OLAM JUMBOQLARI (5-6 SAVOLLAR) ===
    const olamQuestions3 = [
        {
            qText: {
                uz: "🕵️‍♂️ Jumboqni toping: 🍯 + 🐻 + 🌳 = ?",
                en: "🕵️‍♂️ Solve the puzzle: 🍯 + 🐻 + 🌳 = ?",
                ru: "🕵️‍♂️ Отгадайте загадку: 🍯 + 🐻 + 🌳 = ?",
                tr: "🕵️‍♂️ Bulmacayı çözün: 🍯 + 🐻 + 🌳 = ?",
                ko: "🕵️‍♂️ 퍼즐을 맞추세요: 🍯 + 🐻 + 🌳 = ?"
            },
            options: {
                uz: ["Tulkicha 🦊", "Ayiqvoy 🐻", "Quyoncha 🐰", "Bo'ri 🐺"],
                en: ["Fox 🦊", "Bear 🐻", "Rabbit 🐰", "Wolf 🐺"],
                ru: ["Лиса 🦊", "Медведь 🐻", "Кролик 🐰", "Волк 🐺"],
                tr: ["Tilki 🦊", "Ayı 🐻", "Tavşan 🐰", "Kurt 🐺"],
                ko: ["여우 🦊", "곰 🐻", "토끼 🐰", "늑대 🐺"]
            },
            answer: 1
        },
        {
            qText: {
                uz: "🌍 Tabiat jumbog'i: Bulut ➔ Sovuq havo ➔ ?",
                en: "🌍 Nature puzzle: Cloud ➔ Cold air ➔ ?",
                ru: "🌍 Загадка природы: Облако ➔ Холодный воздух ➔ ?",
                tr: "🌍 Doğa bulmacası: Bulut ➔ Soğuk hava ➔ ?",
                ko: "🌍 자연 퍼즐: 구름 ➔ 차가운 공기 ➔ ?"
            },
            options: {
                uz: ["Olov 🔥", "Qor parchalari ❄️", "Quyosh nuri ☀️", "Yashil barg 🍃"],
                en: ["Fire 🔥", "Snowflakes ❄️", "Sunlight ☀️", "Green leaf 🍃"],
                ru: ["Огонь 🔥", "Снежинки ❄️", "Солнечный свет ☀️", "Зеленый лист 🍃"],
                tr: ["Ateş 🔥", "Kar taneleri ❄️", "Güneş ışığı ☀️", "Yeşil yaprak 🍃"],
                ko: ["불 🔥", "눈송이 ❄️", "햇빛 ☀️", "초록 잎 🍃"]
            },
            answer: 1
        }
    ];
    // === ATROFIMIZDAGI OLAM JUMBOQLARI (7-10 SAVOLLAR) ===
    const olamQuestions4 = [
        {
            qText: {
                uz: "🥕 Sabzavot jumbog'i: 🥕 + 🐰 + 🌳 = (Buni eyishni kim yaxshi ko'radi?)",
                en: "🥕 Vegetable puzzle: 🥕 + 🐰 + 🌳 = (Who loves to eat this?)",
                ru: "🥕 Овощная загадка: 🥕 + 🐰 + 🌳 = (Кто любит это есть?)",
                tr: "🥕 Sebze bulmacası: 🥕 + 🐰 + 🌳 = (Bunu yemeyi kim sever?)",
                ko: "🥕 야채 퍼즐: 🥕 + 🐰 + 🌳 = (이것을 먹기 좋아하는 것은?)"
            },
            options: {
                uz: ["Quyoncha 🐰", "Bo'ri 🐺", "Sher 🦁", "Ayiq 🐻"],
                en: ["Rabbit 🐰", "Wolf 🐺", "Lion 🦁", "Bear 🐻"],
                ru: ["Кролик 🐰", "Волк 🐺", "Лев 🦁", "Медведь 🐻"],
                tr: ["Tavşan 🐰", "Kurt 🐺", "Aslan 🦁", "Ayı 🐻"],
                ko: ["토끼 🐰", "늑대 🐺", "사자 🦁", "곰 🐻"]
            },
            answer: 0
        },
        {
            qText: {
                uz: "🍌 Shirin jumboq: 🍌 + 🐵 + 🌴 = (Buni kim yaxshi ko'radi?)",
                en: "🍌 Sweet puzzle: 🍌 + 🐵 + 🌴 = (Who loves this?)",
                ru: "🍌 Сладкая загадка: 🍌 + 🐵 + 🌴 = (Кто это любит?)",
                tr: "🍌 Tatlı bulmaca: 🍌 + 🐵 + 🌴 = (Bunu kim sever?)",
                ko: "🍌 달콤한 퍼즐: 🍌 + 🐵 + 🌴 = (이것을 좋아하는 것은?)"
            },
            options: {
                uz: ["Maymuncha 🐵", "Filvoy 🐘", "Sichqoncha 🐭", "Ot 🐴"],
                en: ["Monkey 🐵", "Elephant 🐘", "Mouse 🐭", "Horse 🐴"],
                ru: ["Обезьяна 🐵", "Слон 🐘", "Мышь 🐭", "Лошадь 🐴"],
                tr: ["Maymun 🐵", "Fil 🐘", "Fare 🐭", "At 🐴"],
                ko: ["원숭이 🐵", "코끼리 🐘", "생쥐 🐭", "말 🐴"]
            },
            answer: 0
        },
        {
            qText: {
                uz: "⚽ Boyagi futbol jumbog'i: Futbol to'pining shakli qanday geometrik shaklda bo'ladi?",
                en: "⚽ Football puzzle: What geometric shape does a football have?",
                ru: "⚽ Футбольная загадка: Какую геометрическую форму имеет футбольный мяч?",
                tr: "⚽ Futbol bulmacası: Futbol topu hangi geometrik şekle sahiptir?",
                ko: "⚽ 축구 퍼즐: 축구공은 어떤 기하학적 모양을 가지고 있나요?"
            },
            options: {
                uz: ["Aylana / Shar ⚽", "Kvadrat 🔲", "Uchburchak 🔺", "Tuxumsimon 🥚"],
                en: ["Circle / Sphere ⚽", "Square 🔲", "Triangle 🔺", "Oval 🥚"],
                ru: ["Круг / Шар ⚽", "Квадрат 🔲", "Треугольник 🔺", "Овал 🥚"],
                tr: ["Daire / Küre ⚽", "Kare 🔲", "Üçgen 🔺", "Oval 🥚"],
                ko: ["원형 / 구형 ⚽", "정사각형 🔲", "삼각형 🔺", "타원형 🥚"]
            },
            answer: 0
        },
        {
            qText: {
                uz: "🚀 Koinot jumbog'i: Kunduzi osmonda bizga yorug'lik va issiqlik beradigan ulkan olovli yulduz qaysi?",
                en: "🚀 Space puzzle: Which giant fiery star gives us light and heat during the day?",
                ru: "🚀 Космическая загадка: Какая гигантская огненная звезда дает нам свет и тепло днем?",
                tr: "🚀 Uzay bulmacası: Gündüzleri bize ışık ve ısı veren devasa ateşli yıldız hangisidir?",
                ko: "🚀 우주 퍼즐: 낮에 우리에게 빛과 열을 주는 거대한 불타는 별은 무엇인가요?"
            },
            options: {
                uz: ["Quyosh ☀️", "Oy 🌙", "Mars 🔴", "Yulduz ⭐"],
                en: ["Sun ☀️", "Moon 🌙", "Mars 🔴", "Star ⭐"],
                ru: ["Солнце ☀️", "Луна 🌙", "Марс 🔴", "Звезда ⭐"],
                tr: ["Güneş ☀️", "Ay 🌙", "Mars 🔴", "Yıldız ⭐"],
                ko: ["태양 ☀️", "달 🌙", "화성 🔴", "별 ⭐"]
            },
            answer: 0
        }
    ];

    // Barcha jumboqlarni bitta umumiy ro'yxatga birlashtirish
    const fullOlamDatabase = olamQuestions1.concat(olamQuestions2, olamQuestions3, olamQuestions4);
    // === 5-QISM: O'YIN MANTIQLARI, TARJIMALAR VA YAKUNIY QAVS ===

    const langData = {
        uz: { title: "🌍 Atrofimizdagi Olam", score: "Ball", "btn-back": "Orqaga qaytish", right: "🎉 To'g'ri! Barakalla!", wrong: "❌ Noto'g'ri, yana urinib ko'r!", "text-question": "Savol" },
        en: { title: "🌍 Our Environment", score: "Score", "btn-back": "Go Back", right: "🎉 Correct! Well done!", wrong: "❌ Incorrect, try again!", "text-question": "Question" },
        ru: { title: "🌍 Окружающий мир", score: "Баллы", "btn-back": "Назад", right: "🎉 Правильно! Молодец!", wrong: "❌ Неверно, попробуйте еще раз!", "text-question": "Вопрос" },
        tr: { title: "🌍 Çevremiz", score: "Puan", "btn-back": "Geri Dön", right: "🎉 Doğru! Tebrikler!", wrong: "❌ Yanlış, tekrar dene!", "text-question": "Soru" },
        ko: { title: "🌍 우리 주변의 세계", score: "점수", "btn-back": "돌아가기", right: "🎉 정답입니다! 잘했어요!", wrong: "❌ 틀렸습니다, 다시 시도해보세요!", "text-question": "질문" }
    };

    function generateQuestion() {
        document.getElementById('result').innerText = '';
        const lang = document.getElementById('lang-select').value;

        if (currentQuestionIndex >= fullOlamDatabase.length) {
            // O'yin tugaganda boshidan boshlaydi
            currentQuestionIndex = 0;
        }

        currentQuestionData = fullOlamDatabase[currentQuestionIndex];
        
        // Savol raqamini yangilash
        document.getElementById("current-question-num").innerText = currentQuestionIndex + 1;

        // Savol matnini chiqarish
        document.getElementById("question-text").innerText = currentQuestionData.qText[lang] || currentQuestionData.qText['uz'];

        // 4 ta variant tugmalariga matnlarni joylash
        for (let i = 0; i < 4; i++) {
            let opt = currentQuestionData.options;
            let optionText = "";
            
            if (Array.isArray(opt)) {
                optionText = opt[i];
            } else {
                optionText = opt[lang] ? opt[lang][i] : opt['uz'][i];
            }
            
            document.getElementById(`opt${i}`).innerText = optionText;
        }
    }

    // Javobni tekshirish funksiyasi (Global oynaga chiqarish)
    window.checkAnswer = function(selectedIndex) {
        const resultDiv = document.getElementById('result');
        const lang = document.getElementById('lang-select').value;

        if (selectedIndex === currentQuestionData.answer) {
            score += 10;
            document.getElementById('score').innerText = score;
            resultDiv.innerText = langData[lang].right;
            resultDiv.style.color = "#2ecc71";
            currentQuestionIndex++;
            setTimeout(generateQuestion, 1500);
        } else {
            resultDiv.innerText = langData[lang].wrong;
            resultDiv.style.color = "#e74c3c";
        }
    }

    // Ballarni reyting uchun bosh sahifaga yuborish mantiqi
    window.saveScoreAndGoBack = function() {
        localStorage.setItem('current_game_score', score);
    }

    // Tilni almashtirish funksiyasi (Global oynaga chiqarish)
    window.changeLanguage = function() {
        const lang = document.getElementById('lang-select').value;
        document.querySelectorAll('[data-lang]').forEach(el => {
            const key = el.getAttribute('data-lang');
            if(langData[lang][key]) {
                el.innerText = langData[lang][key];
            }
        });
        generateQuestion();
    }

    // O'yinni ilk bor yuklash
    generateQuestion();

} // <--- 5-bo'lakning va butun olam_game.js faylining ENG OXIRGI loyihani xatosiz yopuvchi qavsi!
// Test muvaffaqiyatli tugaganda ishlaydigan kod:
let data = JSON.parse(localStorage.getItem('aqlliBolajonData')) || {};
data.diamonds = (data.diamonds || 0) + 5; // 5 olmos berildi!
localStorage.setItem('aqlliBolajonData', JSON.stringify(data));
alert("Tabriklaymiz! Siz 5 olmos yutib oldingiz 💎");

    </script>
    <script src="script.js"></script>

</body>
</html>
